<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="none"/>

  <!-- roof -->
  <path d="M 14 46 L 50 14 L 86 46" fill="none" stroke="#2b2622" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sun / accent dot, tucked where the roof meets the note -->
  <circle cx="50" cy="34" r="9" fill="#c98a5e"/>

  <!-- sticky-note body with a folded corner -->
