  <path d="M 74 76 L 64 76 L 64 90 Z" fill="#fffefa" stroke="#2b2622" stroke-width="5" stroke-linejoin="round"/>

  <!-- face -->
  <circle cx="42" cy="65" r="3.2" fill="#2b2622"/>
  <circle cx="58" cy="65" r="3.2" fill="#2b2622"/>
  <path d="M 45 74 Q 50 77 55 74" fill="none" stroke="#2b2622" stroke-width="3" stroke-linecap="round"/>
</svg>
